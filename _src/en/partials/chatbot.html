  <section class="chatbot" id="chatbot" role="dialog" aria-labelledby="chatbot-title" hidden>

      <span class="chat-avatar">
        <img src="assets/img/nhutinlogo-220.webp" srcset="assets/img/nhutinlogo-220.webp 1x, assets/img/nhutinlogo-440.webp 2x" alt="" width="44" height="44" decoding="async">

      <div class="chat-head-text">
