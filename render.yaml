# Render Blueprint: Dashboard → New → Blueprint → chọn repo này.
# Bản demo giao diện: Static Site miễn phí, form ở chế độ 'demo' (js/main.js) nên không cần PHP.
# Khi cần form gửi mail thật: dùng Dockerfile (Web Service, runtime docker), xem README.
services:
  - type: web
    name: hallco-nhutin
    runtime: static
    staticPublishPath: .
    buildCommand: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /css/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /js/*
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      # Trang tiếng Anh luôn có dấu "/" cuối để link tương đối đúng thư mục en/
      - type: redirect
        source: /en
        destination: /en/
      # Không công khai mã nguồn trang, công cụ build và file PHP
      - type: rewrite
        source: /_src/*
        destination: /404.html
      - type: rewrite
        source: /tools/*
        destination: /404.html
      - type: rewrite
        source: /docs/*
        destination: /404.html
      - type: rewrite
        source: /google-apps-script/*
        destination: /404.html
      - type: rewrite
        source: /lib/*
        destination: /404.html
      - type: rewrite
        source: /send.php
        destination: /404.html
      - type: rewrite
        source: /config.php
        destination: /404.html
      # Trang quản trị: /admin và /admin/login (giao diện, chưa nối máy chủ)
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/login
        destination: /admin/login.html
